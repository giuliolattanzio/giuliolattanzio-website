<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Wi-Fi 7 enterprise con MLO, 320 MHz e 4K-QAM</title>
<desc id="desc">Illustrazione tecnica enterprise di un access point Wi-Fi 7 che utilizza 5 GHz e 6 GHz con Multi-Link Operation, canali a 320 MHz e 4096-QAM.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061523"/><stop offset=".55" stop-color="#0b3454"/><stop offset="1" stop-color="#082235"/></linearGradient>
<radialGradient id="g1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".34"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<radialGradient id="g2"><stop offset="0" stop-color="#34d399" stop-opacity=".30"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
<filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#000" flood-opacity=".3"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="350" cy="500" r="330" fill="url(#g1)"/><circle cx="1230" cy="500" r="330" fill="url(#g2)"/>
<text x="90" y="105" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="700">Wi-Fi 7 enterprise</text>
<text x="92" y="155" fill="#b7daf0" font-family="Arial,Helvetica,sans-serif" font-size="26">MLO · 320 MHz · 4K-QAM · 6 GHz · Multi-RU</text>
<g filter="url(#shadow)">
<rect x="565" y="255" width="470" height="260" rx="42" fill="#eaf5fb" stroke="#6bd4ff" stroke-width="4"/>
<rect x="605" y="295" width="390" height="180" rx="32" fill="#dbeaf3"/>
<circle cx="800" cy="385" r="23" fill="#0ea5e9"/>
<path d="M690 590Q800 485 910 590M720 625Q800 555 880 625M755 655Q800 615 845 655" fill="none" stroke="#70dcff" stroke-width="17" stroke-linecap="round"/>
</g>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
<text x="800" y="230" fill="#fff" font-size="34" font-weight="700">Enterprise Access Point</text>
<g transform="translate(130 280)">
<rect width="300" height="120" rx="25" fill="#0c2841" stroke="#45bff2" stroke-width="2"/>
<text x="150" y="45" fill="#8bdcff" font-size="25" font-weight="700">5 GHz link</text>
<text x="150" y="83" fill="#fff" font-size="34" font-weight="700">MLO</text>
</g>
<g transform="translate(1170 280)">
<rect width="300" height="120" rx="25" fill="#0c342f" stroke="#56d7a8" stroke-width="2"/>
<text x="150" y="45" fill="#9af0cf" font-size="25" font-weight="700">6 GHz link</text>
<text x="150" y="83" fill="#fff" font-size="34" font-weight="700">320 MHz</text>
</g>
<path d="M430 340 C505 340 510 350 565 365" fill="none" stroke="#54c9ff" stroke-width="8" stroke-dasharray="14 12"/>
<path d="M1035 365 C1090 350 1095 340 1170 340" fill="none" stroke="#64dfb2" stroke-width="8" stroke-dasharray="14 12"/>
</g>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
<g transform="translate(105 720)"><rect width="310" height="105" rx="22" fill="#0b2238" stroke="#3bbef6"/><text x="155" y="42" fill="#fff" font-size="27" font-weight="700">4096-QAM</text><text x="155" y="76" fill="#a9d9ef" font-size="20">MCS 12–13</text></g>
<g transform="translate(455 720)"><rect width="310" height="105" rx="22" fill="#0b2238" stroke="#3bbef6"/><text x="155" y="42" fill="#fff" font-size="27" font-weight="700">Puncturing</text><text x="155" y="76" fill="#a9d9ef" font-size="20">interference aware</text></g>
<g transform="translate(805 720)"><rect width="310" height="105" rx="22" fill="#0b302e" stroke="#56d7a8"/><text x="155" y="42" fill="#fff" font-size="27" font-weight="700">Multi-RU</text><text x="155" y="76" fill="#b7eddc" font-size="20">spectral efficiency</text></g>
<g transform="translate(1155 720)"><rect width="310" height="105" rx="22" fill="#0b302e" stroke="#56d7a8"/><text x="155" y="42" fill="#fff" font-size="27" font-weight="700">2.4 / 5 / 6 GHz</text><text x="155" y="76" fill="#b7eddc" font-size="20">tri-band design</text></g>
</g>
</svg>
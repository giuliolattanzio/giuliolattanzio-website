<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="t d">
<title id="t">Domini analizzati in una Wi-Fi survey</title><desc id="d">Coverage, SNR, roaming, interference, capacity e installazione.</desc>
<rect width="1600" height="860" fill="#081a2a"/>
<text x="70" y="85" fill="#fff" font-family="Arial" font-size="50" font-weight="700">Cosa può realmente evidenziare una Wi-Fi survey</text>
<text x="70" y="130" fill="#b7d8e8" font-family="Arial" font-size="24">Il dato RF acquista valore quando viene letto nel contesto del servizio</text>
<g font-family="Arial" text-anchor="middle">
<g transform="translate(90 250)"><rect width="420" height="170" rx="28" fill="#0b2942" stroke="#52c9f5" stroke-width="3"/><text x="210" y="55" fill="#fff" font-size="27" font-weight="700">Coverage & SNR</text><text x="210" y="105" fill="#b8ddec" font-size="21">Segnale utile, noise floor, qualità reale</text></g>
<g transform="translate(590 250)"><rect width="420" height="170" rx="28" fill="#0b3030" stroke="#58d4aa" stroke-width="3"/><text x="210" y="55" fill="#fff" font-size="27" font-weight="700">Roaming</text><text x="210" y="105" fill="#b9e8d9" font-size="21">Secondary coverage e client behavior</text></g>
<g transform="translate(1090 250)"><rect width="420" height="170" rx="28" fill="#30271e" stroke="#ffb56c" stroke-width="3"/><text x="210" y="55" fill="#fff" font-size="27" font-weight="700">Interference</text><text x="210" y="105" fill="#ffd4aa" font-size="21">Co-channel e sorgenti non-Wi-Fi</text></g>
<g transform="translate(90 490)"><rect width="420" height="170" rx="28" fill="#2c2637" stroke="#b58cff" stroke-width="3"/><text x="210" y="55" fill="#fff" font-size="27" font-weight="700">Capacity</text><text x="210" y="105" fill="#dbc9ff" font-size="21">Airtime, density, MCS e retry</text></g>
<g transform="translate(590 490)"><rect width="420" height="170" rx="28" fill="#102f34" stroke="#62d4b1" stroke-width="3"/><text x="210" y="55" fill="#fff" font-size="27" font-weight="700">Installation</text><text x="210" y="105" fill="#bce6dc" font-size="21">AP position, height, antenna, power</text></g>
<g transform="translate(1090 490)"><rect width="420" height="170" rx="28" fill="#112d43" stroke="#72c9f3" stroke-width="3"/><text x="210" y="55" fill="#fff" font-size="27" font-weight="700">Service validation</text><text x="210" y="105" fill="#bdddeb" font-size="21">VoWiFi, Teams, QoE e requisiti</text></g>
</g>
<text x="800" y="765" text-anchor="middle" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Il punto non è misurare tutto. È capire quale dato dimostra la causa.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AudioCodes SBC e Microsoft Teams Direct Routing</title>
  <desc id="desc">Architettura Microsoft Teams Phone verso AudioCodes SBC e SIP Carrier PSTN con signaling SIP TLS e media SRTP.</desc>
  <defs>

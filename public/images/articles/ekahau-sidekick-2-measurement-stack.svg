<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Sidekick 2 nel processo di misura Wi-Fi</title>
  <desc id="desc">Diagramma tecnico che mostra Sidekick 2 come strumento di misura tra ambiente RF, spettro e analisi Ekahau.</desc>
  <rect width="1400" height="780" fill="#ffffff"/>
  <text x="80" y="95" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#0B1220">Sidekick 2 come riferimento di misura</text>
  <text x="80" y="140" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#526071">L'obiettivo è separare la raccolta professionale dei dati dalle variabili del singolo client.</text>

  <g transform="translate(90 250)">
    <rect width="300" height="300" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="30" y="48" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#2563EB">AMBIENTE WI-FI</text>
    <circle cx="150" cy="155" r="20" fill="#0B1220"/>
    <path d="M105 151c25-28 65-28 90 0M78 122c42-48 102-48 144 0M51 93c58-68 140-68 198 0" fill="none" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>
    <text x="30" y="255" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#526071">2,4 / 5 / 6 GHz</text>
  </g>

  <g transform="translate(550 210)">
    <rect width="300" height="380" rx="30" fill="#0B1220"/>
    <text x="150" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#ffffff">SIDEKICK 2</text>
    <rect x="85" y="105" width="130" height="160" rx="24" fill="#ffffff"/>
    <rect x="110" y="132" width="80" height="80" rx="15" fill="#eef4ff"/>
    <circle cx="150" cy="236" r="9" fill="#2563EB"/>
    <text x="150" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#ffffff">RF + spectrum data</text>
    <text x="150" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#cbd5e1">raccolta sul campo</text>
  </g>

  <g transform="translate(1010 250)">
    <rect width="300" height="300" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="30" y="48" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#2563EB">ANALISI EKAHAU</text>
    <rect x="52" y="90" width="196" height="125" rx="14" fill="#ffffff" stroke="#0B1220" stroke-width="3"/>
    <path d="M75 184c24-55 48-21 71-55 26-38 43 16 78-13" fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round"/>
    <text x="30" y="255" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#526071">Heatmap e correlazioni</text>
  </g>

  <path d="M405 400h120M875 400h120" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/>
  <path d="M512 386l20 14-20 14M982 386l20 14-20 14" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="80" y="675" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#0B1220">Dato affidabile → interpretazione corretta → decisione tecnica difendibile.</text>
  <text x="80" y="720" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#526071">Il valore dello strumento emerge quando la misura viene inserita in un metodo di survey coerente.</text>
</svg>
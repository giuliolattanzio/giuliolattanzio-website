<g transform="translate(595 250)"><rect width="410" height="420" rx="30" fill="#102f34" stroke="#62d4b1" stroke-width="3"/><text x="205" y="55" fill="#fff" font-size="30" font-weight="700">Interpretazione</text><circle cx="205" cy="190" r="100" fill="#173f45"/><path d="M135 210Q205 120 275 210M160 240Q205 185 250 240" fill="none" stroke="#6ed6b5" stroke-width="13" stroke-linecap="round"/><text x="205" y="335" fill="#b9e8dc" font-size="21">RF + 802.11 + Client</text><text x="205" y="370" fill="#b9e8dc" font-size="21">Capacity + Roaming</text></g>
<g transform="translate(1100 280)"><rect width="410" height="360" rx="30" fill="#30271e" stroke="#ffb56c" stroke-width="3"/><text x="205" y="55" fill="#fff" font-size="30" font-weight="700">Remediation</text><path d="M85 240L150 175L210 210L315 120" fill="none" stroke="#ffc27f" stroke-width="12" stroke-linecap="round"/><circle cx="85" cy="240" r="12" fill="#ffc27f"/><circle cx="150" cy="175" r="12" fill="#ffc27f"/><circle cx="210" cy="210" r="12" fill="#ffc27f"/><circle cx="315" cy="120" r="12" fill="#ffc27f"/><text x="205" y="320" fill="#ffd4aa" font-size="21">Correggere la causa, non il sintomo</text></g>

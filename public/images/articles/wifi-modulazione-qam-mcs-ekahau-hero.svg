<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Modulazione Wi-Fi da BPSK a 4096-QAM</title>
<desc id="desc">Illustrazione tecnica professionale con access point enterprise, costellazioni QAM, MCS, SNR ed Ekahau Sidekick 2.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071522"/><stop offset=".55" stop-color="#103954"/><stop offset="1" stop-color="#071b2e"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#38bdf8" stop-opacity=".28"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="17" flood-color="#000" flood-opacity=".34"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="820" cy="465" r="420" fill="url(#glow)"/>
<text x="82" y="100" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="57" font-weight="700">Modulazione nel Wi-Fi</text>
<text x="84" y="150" fill="#b9dcec" font-family="Arial,Helvetica,sans-serif" font-size="25">BPSK · QPSK · QAM · MCS · SNR · Ekahau</text>

<g filter="url(#shadow)">
<rect x="565" y="270" width="470" height="230" rx="40" fill="#eaf4f8" stroke="#68d3ff" stroke-width="4"/>
<rect x="610" y="310" width="380" height="145" rx="28" fill="#dbe9f0"/>
<circle cx="800" cy="382" r="20" fill="#0ea5e9"/>
<path d="M690 555Q800 450 910 555M725 595Q800 525 875 595M760 630Q800 595 840 630" fill="none" stroke="#6edaff" stroke-width="16" stroke-linecap="round"/>
</g>

<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
<text x="800" y="245" fill="#fff" font-size="31" font-weight="700">Enterprise Access Point</text>
<g transform="translate(105 250)">
<rect width="320" height="360" rx="28" fill="#0b263c" stroke="#52c9f5" stroke-width="2"/>
<text x="160" y="50" fill="#fff" font-size="28" font-weight="700">Costellazione</text>
<g fill="#72d9ff">
<circle cx="70" cy="115" r="7"/><circle cx="135" cy="115" r="7"/><circle cx="200" cy="115" r="7"/><circle cx="265" cy="115" r="7"/>
<circle cx="70" cy="180" r="7"/><circle cx="135" cy="180" r="7"/><circle cx="200" cy="180" r="7"/><circle cx="265" cy="180" r="7"/>
<circle cx="70" cy="245" r="7"/><circle cx="135" cy="245" r="7"/><circle cx="200" cy="245" r="7"/><circle cx="265" cy="245" r="7"/>
<circle cx="70" cy="310" r="7"/><circle cx="135" cy="310" r="7"/><circle cx="200" cy="310" r="7"/><circle cx="265" cy="310" r="7"/>
</g>
</g>
<g transform="translate(1175 250)">
<rect width="320" height="360" rx="28" fill="#0b2f32" stroke="#59d6aa" stroke-width="2"/>
<text x="160" y="50" fill="#fff" font-size="28" font-weight="700">Qualità RF</text>
<text x="160" y="120" fill="#9aebcf" font-size="23">SNR ↑</text>
<text x="160" y="170" fill="#fff" font-size="34" font-weight="700">MCS ↑</text>
<text x="160" y="225" fill="#9aebcf" font-size="23">Data rate ↑</text>
<text x="160" y="285" fill="#fff" font-size="25" font-weight="700">Ekahau AI Pro</text>
<text x="160" y="322" fill="#b8e8d7" font-size="20">+ Sidekick 2</text>
</g>
</g>

<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
<rect x="130" y="715" width="1340" height="100" rx="24" fill="#0a2338" stroke="#437f9f" stroke-width="2"/>
<text x="800" y="757" fill="#fff" font-size="29" font-weight="700">Più bit per simbolo richiedono un collegamento radio più pulito</text>
<text x="800" y="793" fill="#a9d0df" font-size="21">BPSK → QPSK → 16-QAM → 64-QAM → 256-QAM → 1024-QAM → 4096-QAM</text>
</g>
</svg>
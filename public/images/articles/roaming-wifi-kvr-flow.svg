<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Flusso roaming Wi-Fi con 802.11k, 802.11v e 802.11r</title>
  <desc id="desc">Tre access point enterprise e un client che passa da AP1 ad AP2 usando Neighbor Report, BSS Transition Management e Fast BSS Transition.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#153a5d"/>
    </linearGradient>
    <linearGradient id="cell1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".34"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="cell2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".34"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="cell3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity=".30"/>
      <stop offset="1" stop-color="#6ee7b7" stop-opacity=".07"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="1600" height="720" rx="28" fill="url(#bg)"/>
  <text x="90" y="88" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700">Roaming Wi-Fi enterprise: il ruolo di 802.11k, 802.11v e 802.11r</text>
  <text x="90" y="132" fill="#bfdbfe" font-family="Arial,Helvetica,sans-serif" font-size="24">Scoperta del candidato → suggerimento di transizione → handoff rapido</text>

  <g filter="url(#shadow)">
    <ellipse cx="330" cy="380" rx="260" ry="190" fill="url(#cell1)" stroke="#60a5fa" stroke-width="2" stroke-dasharray="8 10"/>
    <ellipse cx="800" cy="380" rx="270" ry="195" fill="url(#cell2)" stroke="#67e8f9" stroke-width="2" stroke-dasharray="8 10"/>
    <ellipse cx="1270" cy="380" rx="260" ry="190" fill="url(#cell3)" stroke="#6ee7b7" stroke-width="2" stroke-dasharray="8 10"/>
  </g>

  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
    <g transform="translate(330 245)">
      <rect x="-72" y="-45" width="144" height="78" rx="22" fill="#e2e8f0" stroke="#93c5fd" stroke-width="3"/>
      <circle cx="0" cy="-6" r="11" fill="#2563eb"/>
      <path d="M-34 55 Q0 25 34 55 M-22 67 Q0 48 22 67 M-7 80 Q0 74 7 80" fill="none" stroke="#60a5fa" stroke-width="7" stroke-linecap="round"/>
      <text y="118" fill="#fff" font-size="32" font-weight="700">AP1</text>
      <text y="151" fill="#bfdbfe" font-size="21">Canale 36</text>
    </g>
    <g transform="translate(800 245)">
      <rect x="-72" y="-45" width="144" height="78" rx="22" fill="#e2e8f0" stroke="#67e8f9" stroke-width="3"/>
      <circle cx="0" cy="-6" r="11" fill="#0891b2"/>
      <path d="M-34 55 Q0 25 34 55 M-22 67 Q0 48 22 67 M-7 80 Q0 74 7 80" fill="none" stroke="#22d3ee" stroke-width="7" stroke-linecap="round"/>
      <text y="118" fill="#fff" font-size="32" font-weight="700">AP2</text>
      <text y="151" fill="#cffafe" font-size="21">Canale 44</text>
    </g>
    <g transform="translate(1270 245)">
      <rect x="-72" y="-45" width="144" height="78" rx="22" fill="#e2e8f0" stroke="#6ee7b7" stroke-width="3"/>
      <circle cx="0" cy="-6" r="11" fill="#059669"/>
      <path d="M-34 55 Q0 25 34 55 M-22 67 Q0 48 22 67 M-7 80 Q0 74 7 80" fill="none" stroke="#34d399" stroke-width="7" stroke-linecap="round"/>
      <text y="118" fill="#fff" font-size="32" font-weight="700">AP3</text>
      <text y="151" fill="#d1fae5" font-size="21">Canale 149</text>
    </g>
  </g>

  <path d="M330 535 C480 600, 650 600, 790 535 S1090 470, 1270 535" fill="none" stroke="#7dd3fc" stroke-width="7" stroke-dasharray="14 12" marker-end="url(#arrow)"/>
  <g transform="translate(640 505)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="45" fill="#0f172a" stroke="#93c5fd" stroke-width="4"/>
    <rect x="-18" y="-24" width="36" height="48" rx="5" fill="#dbeafe"/>
    <circle cx="0" cy="16" r="3" fill="#1e3a8a"/>
  </g>

  <g font-family="Arial,Helvetica,sans-serif">
    <g transform="translate(195 615)">
      <rect width="335" height="72" rx="16" fill="#10223f" stroke="#3b82f6"/>
      <text x="24" y="30" fill="#93c5fd" font-size="22" font-weight="700">802.11k — Neighbor Report</text>
      <text x="24" y="56" fill="#e2e8f0" font-size="18">Riduce i canali da scandire</text>
    </g>
    <g transform="translate(635 615)">
      <rect width="335" height="72" rx="16" fill="#10223f" stroke="#22d3ee"/>
      <text x="24" y="30" fill="#67e8f9" font-size="22" font-weight="700">802.11v — BSS Transition</text>
      <text x="24" y="56" fill="#e2e8f0" font-size="18">Suggerisce il BSS candidato</text>
    </g>
    <g transform="translate(1075 615)">
      <rect width="335" height="72" rx="16" fill="#10223f" stroke="#34d399"/>
      <text x="24" y="30" fill="#6ee7b7" font-size="22" font-weight="700">802.11r — Fast Transition</text>
      <text x="24" y="56" fill="#e2e8f0" font-size="18">Riduce il tempo di handoff</text>
    </g>
  </g>
</svg>
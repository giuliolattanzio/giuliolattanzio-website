<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><text x="70" y="70" font-family="Arial" font-size="34" font-weight="700" fill="#0B1220">Antenne direzionali Wi-Fi</text><text x="70" y="108" font-family="Arial" font-size="20" fill="#475569">Confronto concettuale dei pattern in azimuth</text><g font-family="Arial" text-anchor="middle" fill="#0B1220"><text x="220" y="180" font-size="24" font-weight="700">Panel / Patch</text><text x="600" y="180" font-size="24" font-weight="700">Settoriale</text><text x="980" y="180" font-size="24" font-weight="700">Yagi / Narrow beam</text></g><g stroke="#cbd5e1" fill="none" stroke-width="2"><circle cx="220" cy="355" r="150"/><circle cx="600" cy="355" r="150"/><circle cx="980" cy="355" r="150"/><path d="M60 355h320M220 195v320M440 355h320M600 195v320M820 355h320M980 195v320"/></g><g fill="#2563EB" fill-opacity=".16" stroke="#2563EB" stroke-width="6"><path d="M220 355 C285 275 345 285 365 355 C345 425 285 435 220 355Z"/><path d="M600 355 L720 270 A150 150 0 0 1 720 440 Z"/><path d="M980 355 C1050 322 1110 333 1128 355 C1110 377 1050 388 980 355Z"/></g><g font-family="Arial" text-anchor="middle" fill="#475569" font-size="18"><text x="220" y="555">lobo ampio, orientato</text><text x="600" y="555">settore angolare definito</text><text x="980" y="555">lobo stretto, maggiore direttività</text></g><text x="70" y="625" font-family="Arial" font-size="17" fill="#475569">I diagrammi sono didattici: beamwidth e lobi reali dipendono dal modello, dalla frequenza, dal mounting e dalla polarizzazione.</text></svg>
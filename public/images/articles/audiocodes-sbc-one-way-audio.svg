<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="t d"><title id="t">Diagnosi one-way audio AudioCodes SBC</title><desc id="d">Cause principali di one-way audio: NAT, firewall, SDP, codec e media anchoring.</desc><rect width="1600" height="860" fill="#081a2a"/><text x="70" y="85" fill="#fff" font-family="Arial" font-size="50" font-weight="700">One-way audio: seguire il media path</text><text x="70" y="130" fill="#b7d8e8" font-family="Arial" font-size="24">Se una direzione funziona, trovare il punto esatto in cui l'altra scompare</text><g font-family="Arial" text-anchor="middle"><g transform="translate(90 240)"><rect width="330" height="250" rx="28" fill="#0b2942" stroke="#57d7ff" stroke-width="3"/><text x="165" y="55" fill="#fff" font-size="29" font-weight="700">1 · SDP</text><text x="165" y="115" fill="#b7ddec" font-size="21">IP media</text><text x="165" y="153" fill="#b7ddec" font-size="21">Porta RTP</text><text x="165" y="191" fill="#b7ddec" font-size="21">Codec / SRTP</text></g><g transform="translate(465 240)"><rect width="330" height="250" rx="28" fill="#30271e" stroke="#ffae5b" stroke-width="3"/><text x="165" y="55" fill="#fff" font-size="29" font-weight="700">2 · NAT</text><text x="165" y="115" fill="#ffd0a2" font-size="21">Public IP</text><text x="165" y="153" fill="#ffd0a2" font-size="21">Port mapping</text><text x="165" y="191" fill="#ffd0a2" font-size="21">Symmetry</text></g><g transform="translate(840 240)"><rect width="330" height="250" rx="28" fill="#30271e" stroke="#ffae5b" stroke-width="3"/><text x="165" y="55" fill="#fff" font-size="29" font-weight="700">3 · Firewall</text><text x="165" y="115" fill="#ffd0a2" font-size="21">UDP range</text><text x="165" y="153" fill="#ffd0a2" font-size="21">Direction</text><text x="165" y="191" fill="#ffd0a2" font-size="21">State / policy</text></g><g transform="translate(1215 240)"><rect width="300" height="250" rx="28" fill="#0b3030" stroke="#58d4aa" stroke-width="3"/><text x="150" y="55" fill="#fff" font-size="29" font-weight="700">4 · SBC</text><text x="150" y="115" fill="#b9e8d9" font-size="21">Media realm</text><text x="150" y="153" fill="#b9e8d9" font-size="21">Anchoring</text><text x="150" y="191" fill="#b9e8d9" font-size="21">Transcoding</text></g></g><g font-family="Arial" text-anchor="middle"><rect x="165" y="600" width="1270" height="125" rx="25" fill="#0a2237" stroke="#4a819f" stroke-width="2"/><text x="800" y="648" fill="#fff" font-size="30" font-weight="700">Metodo: packet capture su entrambi i leg</text><text x="800" y="690" fill="#adcfe0" font-size="22">RTP ricevuto → RTP elaborato → RTP trasmesso → traffico di ritorno</text></g></svg>
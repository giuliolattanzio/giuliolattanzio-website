<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">Evil twin e captive portal falso su rete Wi-Fi hotel</title>
<desc id="desc">Diagramma che mostra un client tra access point legittimo e access point evil twin con captive portal falso e traffico verso Internet.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081827"/><stop offset="1" stop-color="#0d3653"/></linearGradient>
<filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
<marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#6dd7ff"/></marker>
<marker id="orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#ffad66"/></marker>
</defs>
<rect width="1600" height="820" fill="url(#bg)"/>
<text x="80" y="90" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="700">Evil Twin: quando la rete falsa sembra quella giusta</text>
<text x="82" y="135" fill="#b8d8eb" font-family="Arial,Helvetica,sans-serif" font-size="24">Il rischio nasce dalla fiducia nel nome dell'SSID e nel captive portal</text>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle" filter="url(#shadow)">
<g transform="translate(100 245)"><rect width="360" height="310" rx="28" fill="#0e2c46" stroke="#58c9fa" stroke-width="3"/><text x="180" y="58" fill="#fff" font-size="30" font-weight="700">AP legittimo</text><rect x="100" y="95" width="160" height="85" rx="28" fill="#edf7fb"/><circle cx="180" cy="138" r="12" fill="#0ea5e9"/><path d="M125 225Q180 175 235 225M145 255Q180 223 215 255" fill="none" stroke="#65d5ff" stroke-width="10" stroke-linecap="round"/><text x="180" y="292" fill="#b7def1" font-size="22">Hotel_Guest</text></g>
<g transform="translate(620 225)"><rect width="360" height="350" rx="28" fill="#0e2c46" stroke="#70dbff" stroke-width="3"/><text x="180" y="58" fill="#fff" font-size="30" font-weight="700">Client</text><rect x="95" y="100" width="170" height="118" rx="16" fill="#dcebf3"/><rect x="118" y="122" width="124" height="70" rx="7" fill="#17364f"/><rect x="76" y="220" width="208" height="20" rx="10" fill="#b8cbd6"/><text x="180" y="292" fill="#b7def1" font-size="22">Quale SSID è quello vero?</text></g>
<g transform="translate(1140 245)"><rect width="360" height="310" rx="28" fill="#39291f" stroke="#ffad66" stroke-width="3"/><text x="180" y="58" fill="#fff" font-size="30" font-weight="700">Evil Twin</text><rect x="100" y="95" width="160" height="85" rx="28" fill="#fff1e2"/><circle cx="180" cy="138" r="12" fill="#f97316"/><path d="M125 225Q180 175 235 225M145 255Q180 223 215 255" fill="none" stroke="#ffad66" stroke-width="10" stroke-linecap="round"/><text x="180" y="292" fill="#ffd0a2" font-size="22">Hotel-Guest</text></g>
</g>
<path d="M460 390H620" stroke="#6dd7ff" stroke-width="7" fill="none" marker-end="url(#blue)"/>
<path d="M1140 390H980" stroke="#ffad66" stroke-width="7" fill="none" marker-end="url(#orange)"/>
<g font-family="Arial,Helvetica,sans-serif">
<rect x="190" y="650" width="1220" height="105" rx="24" fill="#0a2237" stroke="#4a86a5" stroke-width="2"/>
<text x="800" y="690" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">Captive portal falso → phishing → traffico sotto controllo dell'attaccante</text>
<text x="800" y="728" text-anchor="middle" fill="#aecfe0" font-size="21">HTTPS e TLS riducono molti rischi, ma non possono impedire all'utente di fidarsi della rete sbagliata</text>
</g>
</svg>
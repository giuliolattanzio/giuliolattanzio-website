<g transform="translate(380 280)"><rect width="260" height="260" rx="26" fill="#0b2942" stroke="#64d6ff" stroke-width="2"/><text x="130" y="50" fill="#fff" font-size="28" font-weight="700">802.11</text><text x="130" y="125" fill="#8edfff" font-size="22">Association</text><text x="130" y="165" fill="#8edfff" font-size="22">Authentication</text><text x="130" y="205" fill="#8edfff" font-size="22">Roaming</text></g>
<g transform="translate(680 280)"><rect width="260" height="260" rx="26" fill="#0b2942" stroke="#6bd6c0" stroke-width="2"/><text x="130" y="50" fill="#fff" font-size="28" font-weight="700">Client</text><rect x="88" y="95" width="84" height="130" rx="16" fill="#e6f1f6"/><rect x="101" y="110" width="58" height="82" rx="7" fill="#163650"/><text x="130" y="245" fill="#b8e7dc" font-size="18">Driver · Sticky · MCS</text></g>
<g transform="translate(980 280)"><rect width="260" height="260" rx="26" fill="#0b2942" stroke="#7abaf6" stroke-width="2"/><text x="130" y="50" fill="#fff" font-size="28" font-weight="700">Network</text><text x="130" y="120" fill="#b8ddf1" font-size="22">DHCP · DNS</text><text x="130" y="160" fill="#b8ddf1" font-size="22">VLAN · QoS</text><text x="130" y="200" fill="#b8ddf1" font-size="22">Routing</text></g>
<g transform="translate(1280 280)"><rect width="240" height="260" rx="26" fill="#0b3030" stroke="#58d4aa" stroke-width="2"/><text x="120" y="50" fill="#fff" font-size="28" font-weight="700">Application</text><circle cx="120" cy="145" r="54" fill="#132937" stroke="#62d7ad" stroke-width="4"/><path d="M92 145h56M120 117v56" stroke="#62d7ad" stroke-width="9" stroke-linecap="round"/><text x="120" y="235" fill="#b9e8da" font-size="18">Voice · Cloud · VPN</text></g>

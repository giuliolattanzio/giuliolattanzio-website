<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Voice over Wi-Fi enterprise</title>
<desc id="desc">Illustrazione tecnica di una chiamata VoWiFi con access point enterprise, roaming, QoS, jitter, latency ed Ekahau.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071522"/><stop offset=".55" stop-color="#103a58"/><stop offset="1" stop-color="#071c30"/></linearGradient>
<filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".32"/></filter>
<marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#74d7ff"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="82" y="102" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="57" font-weight="700">Voice over Wi-Fi enterprise</text>
<text x="84" y="150" fill="#b9dceb" font-family="Arial,Helvetica,sans-serif" font-size="25">Roaming · QoS · Jitter · Latency · Packet Loss · Ekahau</text>


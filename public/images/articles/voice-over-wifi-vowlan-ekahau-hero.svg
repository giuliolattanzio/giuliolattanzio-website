<g transform="translate(625 235)"><rect width="350" height="370" rx="28" fill="#0c2b43" stroke="#63d9ff" stroke-width="2"/><text x="175" y="54" fill="#fff" font-size="30" font-weight="700">Access Point</text><rect x="75" y="105" width="200" height="95" rx="32" fill="#eaf5f9"/><circle cx="175" cy="152" r="14" fill="#0ea5e9"/><path d="M105 245Q175 180 245 245M125 280Q175 232 225 280M153 310Q175 290 197 310" fill="none" stroke="#6ddaff" stroke-width="11" stroke-linecap="round"/><text x="175" y="346" fill="#b8ddec" font-size="21">WMM / QoS</text></g>
<g transform="translate(1155 255)"><rect width="350" height="330" rx="28" fill="#0c2f31" stroke="#59d5aa" stroke-width="2"/><text x="175" y="54" fill="#fff" font-size="30" font-weight="700">Voice Platform</text><rect x="95" y="110" width="160" height="110" rx="18" fill="#10202b" stroke="#62d4ad"/><circle cx="130" cy="145" r="7" fill="#41dd8d"/><circle cx="155" cy="145" r="7" fill="#41dd8d"/><rect x="180" y="132" width="50" height="24" rx="4" fill="#28434e"/><text x="175" y="270" fill="#b9e9d9" font-size="22">PBX / SBC / Cloud UC</text></g>
</g>

<path d="M445 420H625" stroke="#73d8ff" stroke-width="7" fill="none" marker-end="url(#arr)"/>
<path d="M975 420H1155" stroke="#62d7ad" stroke-width="7" fill="none" marker-end="url(#arr)"/>


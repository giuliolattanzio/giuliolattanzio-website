<text x="70" y="85" fill="#fff" font-family="Arial" font-size="50" font-weight="700">AI Pro Online: Measured Mode vs Design Mode</text>
<text x="70" y="130" fill="#b7d8e8" font-family="Arial" font-size="24">Separare ciò che è stato realmente misurato da ciò che viene simulato</text>

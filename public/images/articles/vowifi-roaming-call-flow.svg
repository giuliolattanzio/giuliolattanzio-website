<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">Roaming VoWiFi</title>
<desc id="desc">Diagramma di una chiamata voce che passa da AP1 ad AP2 mantenendo il flusso RTP.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081827"/><stop offset="1" stop-color="#0d3550"/></linearGradient>
<marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#75d7ff"/></marker>
</defs>
<rect width="1600" height="820" fill="url(#bg)"/>
<text x="75" y="90" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="700">Roaming VoWiFi: il momento più delicato della chiamata</text>
<text x="77" y="135" fill="#b6d8e9" font-family="Arial,Helvetica,sans-serif" font-size="24">Il client deve cambiare BSSID senza interrompere il flusso real-time</text>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
<g transform="translate(130 240)"><rect width="320" height="260" rx="28" fill="#0b2a43" stroke="#52c9f5" stroke-width="2"/><text x="160" y="48" fill="#fff" font-size="28" font-weight="700">AP1</text><rect x="80" y="90" width="160" height="78" rx="28" fill="#edf7fb"/><circle cx="160" cy="129" r="12" fill="#0ea5e9"/><text x="160" y="220" fill="#b8ddec" font-size="21">BSSID A</text></g>
<g transform="translate(640 210)"><rect width="320" height="320" rx="28" fill="#0b2a43" stroke="#74d7ff" stroke-width="2"/><text x="160" y="50" fill="#fff" font-size="28" font-weight="700">VoWiFi Client</text><rect x="115" y="95" width="90" height="150" rx="18" fill="#e8f3f8"/><rect x="130" y="112" width="60" height="100" rx="8" fill="#17364f"/><text x="160" y="286" fill="#b9ddec" font-size="21">Call active</text></g>
<g transform="translate(1150 240)"><rect width="320" height="260" rx="28" fill="#0b3030" stroke="#58d5aa" stroke-width="2"/><text x="160" y="48" fill="#fff" font-size="28" font-weight="700">AP2</text><rect x="80" y="90" width="160" height="78" rx="28" fill="#edf7fb"/><circle cx="160" cy="129" r="12" fill="#10b981"/><text x="160" y="220" fill="#b9e8da" font-size="21">BSSID B</text></g>
</g>
<path d="M450 370H640" stroke="#75d7ff" stroke-width="7" fill="none" marker-end="url(#arr)"/>
<path d="M960 370H1150" stroke="#5ed7ac" stroke-width="7" fill="none" marker-end="url(#arr)"/>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
<rect x="180" y="620" width="1240" height="110" rx="24" fill="#0a2237" stroke="#4b819f" stroke-width="2"/>
<text x="800" y="662" fill="#fff" font-size="29" font-weight="700">802.11k / 802.11v / 802.11r riducono attrito, ma il roaming resta client-driven</text>
<text x="800" y="702" fill="#adcfdc" font-size="21">Target: transizione rapida, nessun cambio IP imprevisto, packet loss minimo durante il passaggio</text>
</g>
</svg>
  <g font-family="Arial,Helvetica,sans-serif"><text x="82" y="80" fill="#f8fafc" font-size="52" font-weight="700">Roaming Wi-Fi enterprise</text><text x="82" y="132" fill="#dbeafe" font-size="31">802.11k · 802.11v · 802.11r — discovery, steering e fast transition</text></g>

    <g transform="translate(105 700)"><rect width="410" height="125" rx="20" fill="#0b2038" fill-opacity=".94" stroke="#3b82f6" stroke-width="2"/><text x="26" y="40" fill="#93c5fd" font-size="27" font-weight="700">802.11k · Neighbor Report</text><text x="26" y="76" fill="#f1f5f9" font-size="21">Il client scopre rapidamente</text><text x="26" y="104" fill="#f1f5f9" font-size="21">gli AP candidati</text></g>
    <g transform="translate(595 700)"><rect width="410" height="125" rx="20" fill="#0b2038" fill-opacity=".94" stroke="#22d3ee" stroke-width="2"/><text x="26" y="40" fill="#67e8f9" font-size="27" font-weight="700">802.11v · BSS Transition</text><text x="26" y="76" fill="#f1f5f9" font-size="21">L'infrastruttura suggerisce</text><text x="26" y="104" fill="#f1f5f9" font-size="21">il BSS più opportuno</text></g>
    <g transform="translate(1085 700)"><rect width="410" height="125" rx="20" fill="#0b2038" fill-opacity=".94" stroke="#34d399" stroke-width="2"/><text x="26" y="40" fill="#6ee7b7" font-size="27" font-weight="700">802.11r · Fast Transition</text><text x="26" y="76" fill="#f1f5f9" font-size="21">L'handoff riduce il tempo</text><text x="26" y="104" fill="#f1f5f9" font-size="21">senza traffico utile</text></g>

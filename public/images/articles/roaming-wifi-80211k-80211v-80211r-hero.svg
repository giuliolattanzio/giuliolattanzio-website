<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Roaming Wi-Fi enterprise con 802.11k, 802.11v e 802.11r</title>
  <desc id="desc">Illustrazione tecnica di un ambiente enterprise con tre Access Point, un client in movimento e le funzioni Neighbor Report, BSS Transition e Fast Transition.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081625"/><stop offset="0.5" stop-color="#123352"/><stop offset="1" stop-color="#07111e"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f4f70" stop-opacity=".45"/><stop offset="1" stop-color="#08111d" stop-opacity=".15"/></linearGradient>
    <radialGradient id="c1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".42"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="c2"><stop offset="0" stop-color="#22d3ee" stop-opacity=".42"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="c3"><stop offset="0" stop-color="#34d399" stop-opacity=".38"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>

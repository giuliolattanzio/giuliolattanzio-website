media:
  - name: article_images
    label: Immagini articoli
    input: public/images/articles
    output: /images/articles
    categories: [image]
    rename: safe

content:
  - name: articles
    label: Articoli
    type: collection
    path: src/content/posts/giulio
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{primary}.md"
      field: false
    exclude:
      - _README.md
    view:
      fields: [title, pubDatetime, tags]
      primary: title
      sort: [pubDatetime, title]
      search: [title, description, tags]
      default:
        sort: pubDatetime
        order: desc
    fields:
      - name: title
        label: Titolo
        type: string
        required: true
        description: Scrivi il titolo dell'articolo. Il nome del file verrà creato automaticamente.
        options:
          maxlength: 120

      - name: description
        label: Riassunto
        type: text
        required: true
        description: Una breve descrizione dell'articolo. Verrà mostrata nelle anteprime del sito e nei risultati di ricerca.

      - name: pubDatetime
        label: Data di pubblicazione
        type: date
        required: true
        description: Per un nuovo articolo puoi lasciare la data proposta automaticamente.
        options:
          time: false
          format: yyyy-MM-dd

      - name: draft
        label: Bozza — non pubblicare ancora
        type: boolean
        default: false
        description: Attivalo solo se vuoi salvare l'articolo senza mostrarlo sul sito pubblico.

      - name: tags
        label: Argomenti
        type: select
        required: true
        description: Seleziona uno o più argomenti che descrivono l'articolo.
        options:
          multiple: true
          min: 1
          values:
            - name: wifi
              label: Wi-Fi
            - name: networking
              label: Networking
            - name: alcatel
              label: Alcatel
            - name: fortinet
              label: Fortinet
            - name: fortigate
              label: FortiGate
            - name: vlan
              label: VLAN
            - name: routing
              label: Routing
            - name: vpn
              label: VPN
            - name: ipsec
              label: IPsec
            - name: voip
              label: VoIP
            - name: sip
              label: SIP
            - name: audiocodes
              label: AudioCodes
            - name: audiocodes-sbc
              label: AudioCodes SBC
            - name: call-flow
              label: Call Flow
            - name: interoperabilita
              label: Interoperabilità
            - name: ekahau
              label: Ekahau
            - name: site-survey
              label: Site Survey
            - name: survey-wifi
              label: Survey Wi-Fi
            - name: analisi-wifi
              label: Analisi Wi-Fi
            - name: troubleshooting
              label: Troubleshooting
            - name: wireshark
              label: Wireshark
            - name: security
              label: Security
            - name: microsoft-teams
              label: Microsoft Teams

      - name: ogImage
        label: Immagine di copertina (opzionale)
        type: image
        description: Puoi lasciare questo campo vuoto se l'articolo non ha bisogno di un'immagine di copertina.
        options:
          media: article_images
          path: .
          rename: safe

      - name: body
        label: Articolo
        type: rich-text
        required: true
        description: Scrivi qui il contenuto. Puoi usare titoli, elenchi, link, immagini, tabelle e blocchi di codice.
        options:
          format: markdown
          media: article_images
          path: .
          rename: safe
          switcher: true
